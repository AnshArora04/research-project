<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPD Explorer — The Rise of Alternatives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #080C14; color: #E2EAF4; }
    #root { height: 100%; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0D1526; }
    ::-webkit-scrollbar-thumb { background: #1E3254; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3B82F6; }
    select option { background: #111D35; color: #E2EAF4; }
    button:focus { outline: none; }
    input:focus { outline: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Recharts dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- Data (plain JS, no JSX) — baked from real PPD parquet by web/bake_data.py -->
  <script src="/static/ppd-data.js"></script>

  <!-- Shared components -->
  <script type="text/babel" src="/static/ppd-shared.jsx"></script>

  <!-- Page components -->
  <script type="text/babel" src="/static/ppd-landing.jsx"></script>
  <script type="text/babel" src="/static/ppd-system.jsx"></script>
  <script type="text/babel" src="/static/ppd-consultant.jsx"></script>
  <script type="text/babel" src="/static/ppd-state.jsx"></script>
  <script type="text/babel" src="/static/ppd-analysis.jsx"></script>

  <!-- App shell (includes Methodology + mounts root) -->
  <script type="text/babel" src="/static/ppd-app.jsx"></script>
</body>
</html>
